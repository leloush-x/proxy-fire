name: Release check

# Dry-run the release pipeline on PRs that touch packaging, without publishing.
on:
  pull_request:
    branches: ["main", "master"]
    paths: ["Cargo.toml", "Cargo.lock", "Dockerfile", ".github/workflows/release.yml", "configs/**"]

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Release build
        run: cargo build --release --locked
      - name: Verify binaries exist
        run: |
          test -x target/release/proxy-fire
      - name: Lint Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint < Dockerfile || true
